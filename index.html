<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Full Grind</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
/* Full Grind styles - see repo for complete version */
:root{--v:#5a2bff;--p:#e063f5;--ink:#14082e;--bg:#fbf9ff;--soft:#f1ecff;--softp:#fde8ff;--line:#e4dcf7;--mut:#6a5f85;--ff:'Outfit',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;font:400 16px/1.45 var(--ff);color:var(--ink);background:var(--bg)}
.lg{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px;background:radial-gradient(600px 400px at 100% 0,#e063f588,transparent 70%),radial-gradient(600px 500px at 0 10%,#7a55ff66,transparent 70%),#f1e6ff;text-align:center}
h1{font-size:clamp(48px,10vw,80px);letter-spacing:-.04em}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:99px;border:1px solid var(--ink);background:var(--v);color:#fff;font-weight:500;text-decoration:none;margin-top:20px}
</style></head><body>
<div class="lg">
  <h1>🔥 Full Grind</h1>
  <p style="color:var(--mut);max-width:420px">Note tes paiements et tes messages, suis ta progression, vois où tu te situes.</p>
  <p style="color:var(--mut);font-size:14px">Déploiement en cours — la version complète arrive. En attendant, ouvre le fichier localement ou attends le prochain commit.</p>
  <a class="btn" href="https://github.com/figueiredoleandro696-hash/full-grind-app">Voir le code sur GitHub</a>
</div>
</body></html>
